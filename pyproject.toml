[project]
name = "questionnaire-extractor"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18",
  "openai>=2", "pydantic>=2.10", "python-dotenv>=1",
  "pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1",
]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8", "reportlab>=4", "pymupdf>=1.25"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
